<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Registrar pedido</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>
<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container mt-4 mb-5">
    <h2>Registrar pedido</h2>

    <form th:action="@{/comprobantes/guardar}" th:object="${invoiceForm}" method="post">

        <div class="alert alert-danger" th:if="${#fields.hasGlobalErrors()}">
            <p class="mb-0" th:each="err : ${#fields.globalErrors()}" th:text="${err}"></p>
        </div>

        <div class="mb-3">
            <label class="form-label">Tipo de comprobante</label>
            <select th:field="*{type}" class="form-select">
                <option value="">Seleccione el tipo</option>
                <option value="Factura">Factura</option>
                <option value="Boleta">Boleta</option>
            </select>
            <div class="text-danger" th:if="${#fields.hasErrors('type')}" th:errors="*{type}"></div>
        </div>

        <div class="mb-3">
            <label class="form-label">Fecha</label>
            <input type="date" th:field="*{date}" class="form-control">
            <div class="text-danger" th:if="${#fields.hasErrors('date')}" th:errors="*{date}"></div>
        </div>

        <div class="mb-3">
            <label class="form-label">Cliente</label>
            <select th:field="*{customerId}" class="form-select">
                <option value="">Seleccione un cliente</option>
                <option th:each="cliente : ${clientes}"
                        th:value="${cliente.id}"
                        th:text="${cliente.name + ' - ' + cliente.documentType + ': ' + cliente.document}">
                </option>
            </select>
            <div class="text-danger" th:if="${#fields.hasErrors('customerId')}"
                 th:errors="*{customerId}"></div>
        </div>

        <h4 class="mt-4">Productos</h4>
        <p class="text-muted">Marca los productos del pedido e ingresa la cantidad de cada uno.</p>

        <table class="table table-bordered align-middle">
            <thead class="table-dark">
            <tr>
                <th>Incluir</th>
                <th>Producto</th>
                <th>Precio</th>
                <th>Stock disponible</th>
                <th>Cantidad</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="producto, fila : ${productos}">
                <td>
                    <input type="hidden" th:field="*{details[__${fila.index}__].productId}">
                    <input type="checkbox" class="form-check-input"
                           th:field="*{details[__${fila.index}__].selected}">
                </td>
                <td th:text="${producto.name}"></td>
                <td th:text="${#numbers.formatDecimal(producto.price, 1, 2)}"></td>
                <td th:text="${producto.stock}"></td>
                <td>
                    <input type="text" class="form-control"
                           th:field="*{details[__${fila.index}__].quantity}">
                    <div class="text-danger"
                         th:if="${#fields.hasErrors('details[__${fila.index}__].quantity')}"
                         th:errors="*{details[__${fila.index}__].quantity}"></div>
                </td>
            </tr>
            <tr th:if="${#lists.isEmpty(productos)}">
                <td colspan="5" class="text-center">No hay productos registrados.</td>
            </tr>
            </tbody>
        </table>

        <button type="submit" class="btn btn-primary">Guardar pedido</button>
        <a th:href="@{/comprobantes}" class="btn btn-secondary">Cancelar</a>
    </form>
</div>

</body>
</html>
