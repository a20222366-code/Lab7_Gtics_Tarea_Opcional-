<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Pedidos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>
<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container mt-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h2>Pedidos</h2>
        <a th:href="@{/comprobantes/nuevo}" class="btn btn-primary">Nuevo pedido</a>
    </div>

    <div th:if="${mensaje}" class="alert alert-success" th:text="${mensaje}"></div>

    <table class="table table-bordered table-striped">
        <thead class="table-dark">
        <tr>
            <th>N.º</th>
            <th>Tipo</th>
            <th>Fecha</th>
            <th>Cliente</th>
            <th>Documento</th>
            <th>Total</th>
            <th>Detalle</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="comprobante : ${comprobantes}">
            <td th:text="${comprobante.id}"></td>
            <td th:text="${comprobante.type}"></td>
            <td th:text="${comprobante.date}"></td>
            <td th:text="${comprobante.customer.name}"></td>
            <td th:text="${comprobante.customer.document}"></td>
            <td th:text="${#numbers.formatDecimal(totales[comprobante.id], 1, 2)}"></td>
            <td><a th:href="@{/comprobantes/{id}(id=${comprobante.id})}">Ver</a></td>
        </tr>
        <tr th:if="${#lists.isEmpty(comprobantes)}">
            <td colspan="7" class="text-center">Todavía no hay pedidos registrados.</td>
        </tr>
        </tbody>
    </table>
</div>

</body>
</html>
