<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Detalle del pedido</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>
<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container mt-4">
    <div th:if="${mensaje}" class="alert alert-success" th:text="${mensaje}"></div>

    <h2 th:text="${comprobante.type + ' N.º ' + comprobante.id}"></h2>
    <p>
        <strong>Fecha:</strong> <span th:text="${comprobante.date}"></span><br>
        <strong>Cliente:</strong> <span th:text="${comprobante.customer.name}"></span><br>
        <strong>Documento:</strong>
        <span th:text="${comprobante.customer.documentType + ' ' + comprobante.customer.document}"></span>
    </p>

    <table class="table table-bordered">
        <thead class="table-dark">
        <tr>
            <th>Producto</th>
            <th>Cantidad</th>
            <th>Precio</th>
            <th>Subtotal</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="d : ${detalles}">
            <td th:text="${d.product.name}"></td>
            <td th:text="${d.quantity}"></td>
            <td th:text="${#numbers.formatDecimal(d.price, 1, 2)}"></td>
            <td th:text="${#numbers.formatDecimal(d.subtotal, 1, 2)}"></td>
        </tr>
        </tbody>
        <tfoot>
        <tr>
            <th colspan="3" class="text-end">TOTAL</th>
            <th th:text="${#numbers.formatDecimal(total, 1, 2)}"></th>
        </tr>
        </tfoot>
    </table>

    <a th:href="@{/comprobantes}" class="btn btn-secondary">Volver a pedidos</a>
</div>

</body>
</html>
